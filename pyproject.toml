[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-tactical-analytics"
version = "0.1.0"
description = "Offline-first CS2 tactical analytics and modeling pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "cloudpickle>=3.0,<=3.1.1",
    "matplotlib>=3.8",
    "numpy>=2.0,<2.5",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "tabulate>=0.9",
    "awpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
